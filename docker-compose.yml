version: "3.9"

services:
  api:
    build: .
    container_name: game_store_api
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - mysql
      - redis

  mysql:
    image: mysql:8
    container_name: game_store_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: game_store
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql:/docker-entrypoint-initdb.d

  redis:
    image: redis:7
    container_name: game_store_redis
    ports:
      - "6379:6379"

volumes:
  mysql_data: